[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbcompass"
version = "0.1.0"
description = "Auditable few-shot calibration and model decisions for perturbation response transfer"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "anndata", "h5py", "PyYAML"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
perturbcompass = "perturbcompass.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
