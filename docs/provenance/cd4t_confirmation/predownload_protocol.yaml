      size_bytes: 29424424894
      etag: 2e6705636ebaa276c7bc7c5a148ad096-3508
  forbidden_download: cell_level_files_totaling_over_1_7_TB

metadata_only_eligibility:
  allowed_obs_columns: [target_contrast_gene_name, culture_condition, n_cells_target, n_guides]
  forbidden_obs_columns_include: [ontarget_effect_size, ontarget_significant, n_total_de_genes, n_downstream, guide_correlation_all, donor_correlation_all_mean]
  target_gene_case: uppercase
  require_presence_in_all_conditions: true
  require_source_target_overlap: true
  require_target_is_measured_gene: true
  minimum_cells_per_target_per_condition: 20
  minimum_guides_per_target_per_condition: 1
  minimum_shared_eligible_targets: 1100
  outcome_dependent_filtering: forbidden
  target_log_fc_lfcSE_zscore_and_all_other_numeric_layers_unread: true

partition:
  common_partition_across_conditions: true
  anchor_targets: 256
  anchor_role: anchor
  heldout_role: test
  seed: 360036
  strata:
    - source_effect_rms_quintile
    - minimum_target_cell_count_quartile
    - minimum_guide_count_single_vs_multiple
  no_repartition_after_numeric_access: true

future_final_protocol_locked_choices:
  model_families: [direct_program, scalar, residual_program, low_rank, gene_ridge]
  primary_gene_scope: source_top200_per_target
  source_program_count: 16
  anchor_oof_folds: 5
  anchor_bootstrap_repetitions: 20000
  dominant_family_probability_threshold: 0.80
  dominant_action: choose_anchor_oof_mean_loss_winner
  ambiguous_action: bootstrap_best_probability_weighted_average_of_all_families
  forced_baseline_inclusion: false
  probability_smoothing: none
  test_outcomes_used_once: true
  required_primary_conditions: [Rest, Stim8hr, Stim48hr]
  primary_success_rule: all_three_conditions_selector_oracle_regret_upper_ci_at_most_0.02
  secondary_comparators: [scalar, low_rank]
  context_level_unit_caveat: conditions_share_study_donors_and_protocol

outputs:
  pre_download_freeze: docs/audit/v36_pre_download_freeze.json
  s3_inventory: docs/audit/v36_cd4t_s3_inventory.json
  metadata_report: docs/audit/v36_cd4t_metadata_feasibility.json
  shared_partition: data/derived/v36_cd4t/v36_shared_partition.csv
  eligible_targets: data/derived/v36_cd4t/v36_shared_eligible_targets.csv

references:
  - Zhu et al. Cell 2026. doi:10.1016/j.cell.2026.08.002
  - Virtual Cells Platform Primary Human CD4+ T Cell Perturb-seq v1.0
  - Kassis et al. Scientific Agent Skills. doi:10.48550/arXiv.2609.00065
