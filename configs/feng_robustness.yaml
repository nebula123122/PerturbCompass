stage: V32 exploratory robustness and heterogeneity analysis of V31
analysis_status: post_v31_exploratory
input:
  record_metrics: results/reference/feng_external_validation/record_metrics.csv
  external_summary: results/reference/feng_external_validation/feng_external_summary.json
analysis:
  candidate: residual_program
  primary_comparator: low_rank
  secondary_comparator: gene_ridge
  direct_program_comparators:
  - residual_program
  - low_rank
  - gene_ridge
  - scalar
  metric_scope: top200
  trim_fraction: 0.1
  influence_removals:
  - 1
  - 3
  - 5
  correlation_permutations: 50000
  correlation_seed: 320031
  heterogeneity_features:
  - source_cells
  - source_effect_rms
  - residual_beta_mean
  - residual_beta_sd
outputs:
  summary_json: results/reproduced/feng_robustness/feng_external_validation_robustness_summary.json
  summary_md: results/reproduced/feng_robustness/feng_external_validation_robustness_summary.md
  subgroup_csv: results/reproduced/feng_robustness/subgroup_metrics.csv
  influence_csv: results/reproduced/feng_robustness/influence_metrics.csv
  correlation_csv: results/reproduced/feng_robustness/correlation_metrics.csv
repository_reorganization:
  classification: post_result_organizational_refactor_not_new_preregistration
  original_protocol: docs/provenance/feng_robustness/original_protocol.yaml
  historical_records_preserved_without_edits: true
  reference_results_are_immutable: true
